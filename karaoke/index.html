<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>KARAOKE CON ALBERTO, LA SFIDA!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Outfit:wght@400;600;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --navy:#150a26;
    --navy-deep:#0b0614;
    --panel:#1c1033;
    --panel-2:#241542;
    --gold:#ffc93c;
    --gold-dim:#b9a8d9;
    --cream:#ffffff;
    --red:#ff3b3b;
    --green:#b6ff2e;
    --magenta:#ff2e9a;
    --cyan:#00f0ff;
    --viola:#9d4dff;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(157,77,255,.28), transparent 60%),
      radial-gradient(900px 500px at 10% 110%, rgba(0,240,255,.18), transparent 60%),
      radial-gradient(700px 400px at 50% 50%, rgba(255,46,154,.10), transparent 70%),
      var(--navy-deep);
    color:var(--cream);
    font-family:'Outfit',sans-serif;
    min-height:100%;
    -webkit-tap-highlight-color:transparent;
  }
  #app{min-height:100vh;display:flex;flex-direction:column;}
  .display{font-family:'Bungee',cursive; letter-spacing:1px;}
  .mono{font-family:'Space Mono',monospace;}
  .screen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 18px;text-align:center;gap:18px;}
  .marquee-title{
    font-size:clamp(30px,7.5vw,46px);
    color:var(--gold);
    text-shadow:0 0 18px rgba(255,201,60,.55), 0 4px 0 #7a4b00, 0 8px 0 #3d2500, 0 12px 24px rgba(0,0,0,.6);
    margin:0;line-height:1.15;
  }
  .subtitle{color:var(--gold-dim);opacity:0.9;font-size:14px;margin-top:-8px;}
  .song-banner{
    display:inline-block;
    background:linear-gradient(180deg, var(--panel-2), var(--navy-deep));
    border:2px solid var(--gold);
    border-radius:16px;
    padding:12px 22px;
    box-shadow:0 0 18px rgba(255,201,60,0.25), inset 0 1px 0 rgba(255,255,255,0.08);
  }
  .song-banner .marquee-title{
    font-size:clamp(18px,5vw,26px);
    text-shadow:0 0 10px rgba(255,201,60,.5), 0 3px 0 #7a4b00;
  }
  @media (prefers-reduced-motion: reduce){ .marquee-title{animation:none;} }

  .card{
    background:var(--panel);
    border:1px solid rgba(157,77,255,0.35);
    border-radius:22px;
    padding:26px 22px;
    width:100%;
    max-width:420px;
    box-shadow:0 10px 30px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(157,77,255,0.08);
  }
  /* Suggerimenti al passaggio (data-tip) — stesso motore del quiz */
  .tip-bubble{position:fixed; z-index:9999; background:var(--panel); color:#fff; padding:9px 13px; border-radius:10px;
    font-family:'Outfit',sans-serif; font-size:12.5px; font-weight:600; line-height:1.35; max-width:230px; text-align:center;
    box-shadow:0 8px 20px rgba(0,0,0,.5), 0 0 0 1px rgba(157,77,255,.4); pointer-events:none; opacity:0;
    transform:translate(-50%,-100%) translateY(6px); transition:opacity .12s, transform .12s; left:0; top:0;}
  .tip-bubble.show{opacity:1; transform:translate(-50%,-100%) translateY(-6px);}

  /* Pulsanti 3D "pressabili" come nel quiz: gradiente + gradino d'ombra che si schiaccia al tocco */
  .btn{
    font-family:'Bungee',cursive;
    font-size:15px;
    padding:16px 20px;
    border-radius:18px;
    border:none;
    color:#1a0b00;
    cursor:pointer;
    transition:transform .08s, box-shadow .08s;
    width:100%;
    text-transform:uppercase;
    letter-spacing:0.5px;
    user-select:none;
  }
  .btn:active{transform:translateY(5px);}
  .btn-primary{
    background:linear-gradient(180deg,#ffe08a,var(--gold));
    box-shadow:0 6px 0 #8a5f00, 0 9px 0 rgba(0,0,0,.45), 0 12px 26px rgba(255,201,60,.3);
  }
  .btn-primary:active{box-shadow:0 1px 0 #8a5f00, 0 3px 0 rgba(0,0,0,.45), 0 6px 14px rgba(255,201,60,.25);}
  .btn-ghost{
    background:transparent;color:var(--gold-dim);
    box-shadow:inset 0 0 0 2px rgba(185,168,217,.4);
  }
  .btn-ghost:active{transform:translateY(2px);}
  .btn-danger{
    background:linear-gradient(180deg,#ff8ac6,var(--magenta));color:#fff;
    box-shadow:0 6px 0 #8a0050, 0 9px 0 rgba(0,0,0,.45), 0 12px 26px rgba(255,46,154,.35);
  }
  .btn-danger:active{box-shadow:0 1px 0 #8a0050, 0 3px 0 rgba(0,0,0,.45), 0 6px 14px rgba(255,46,154,.3);}
  .btn-row{display:flex;gap:10px;}
  .btn-sm{width:auto;padding:10px 16px;font-size:12px;border-radius:14px;}

  .label{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--gold-dim);display:block;margin-bottom:6px;text-align:left;}
  .input{
    width:100%;padding:13px 14px;border-radius:10px;border:1px solid rgba(157,77,255,0.4);
    background:var(--navy-deep);color:var(--cream);font-size:16px;font-family:'Outfit',sans-serif;margin-bottom:14px;
  }
  .input.mono{letter-spacing:1px;text-align:center;font-size:16px;word-break:break-all;}
  .input:focus{outline:none;border-color:var(--gold);}

  .code-badge{
    display:inline-block;background:var(--navy-deep);border:2px dashed var(--gold);
    color:var(--gold);font-size:26px;letter-spacing:6px;padding:10px 18px;border-radius:12px;margin:6px 0;
    font-family:'Space Mono',monospace;
  }

  .mic-wrap{position:relative;width:min(52vw,190px);height:min(52vw,190px);margin:0 auto;--lvl:0;}
  .mic-wrap.small{width:64px;height:64px;}
  .mic-halo{transform-origin:center;transform:scale(calc(1 + var(--lvl,0)*0.55));transition:transform .05s linear;}
  .mic-glow{filter:drop-shadow(0 0 calc(6px + var(--lvl,0)*26px) rgba(232,184,78,0.85));}

  .wave-canvas{width:100%;max-width:340px;height:90px;display:block;margin:0 auto;background:var(--navy-deep);border-radius:10px;border:1px solid rgba(232,184,78,0.2);}

  .topbar{
    display:flex;align-items:center;justify-content:space-between;padding:14px 16px;
    background:var(--navy-deep);border-bottom:2px solid var(--viola);gap:10px;flex-wrap:wrap;

  .topbar .app-name{font-size:14px;color:var(--gold);font-family:'Bungee',cursive;}
  .pill{background:var(--panel-2);border-radius:999px;padding:6px 12px;font-size:12px;color:var(--cream);}
  .pill.mono{word-break:break-all;text-align:center;}

  .dash-body{flex:1;width:100%;max-width:640px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:16px;}

  .leaderboard{display:flex;flex-direction:column;gap:10px;}

    display:flex;align-items:center;gap:12px;background:var(--panel-2);

  .lb-row.top1{border-left-color:var(--gold);box-shadow:0 0 14px rgba(255,201,60,0.3);}
  .lb-rank{width:28px;height:28px;border-radius:50%;background:var(--gold);color:var(--navy-deep);
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;}
  .lb-name{flex:1;text-align:left;font-weight:600;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .lb-score{font-family:'Space Mono',monospace;color:var(--gold);font-size:14px;width:44px;text-align:right;flex-shrink:0;}
  .mute-btn{
    width:34px;height:34px;border-radius:50%;border:2px solid var(--red);background:transparent;color:var(--red);

  }
  .mute-btn.on{background:var(--red);color:var(--navy-deep);}
  .air-btn{
    width:34px;height:34px;border-radius:50%;border:2px solid var(--green);background:transparent;color:var(--green);
    cursor:pointer;flex-shrink:0;font-size:14px;display:flex;align-items:center;justify-content:center;
  }
  .air-btn.on{background:var(--green);color:var(--navy-deep);box-shadow:0 0 12px rgba(95,184,139,0.6);}

  .banner-muted{
    background:rgba(255,71,87,0.15);border:1px solid var(--red);color:var(--red);

  .qr-panel{background:var(--navy-deep);border-radius:14px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:10px;}
  .qr-panel canvas, .qr-panel img{background:white;padding:8px;border-radius:8px;}

  /* Overlay invito gruppo WhatsApp (lato partecipante), stessa impostazione del quiz */
  .wa-overlay{display:none; position:fixed; inset:0; z-index:998; background:rgba(5,2,10,.96); backdrop-filter:blur(6px);
    align-items:center; justify-content:center; padding:26px; text-align:center; flex-direction:column;}
  .wa-overlay.show{display:flex;}
  .wa-overlay .wa-title{font-family:'Bungee',cursive; font-size:clamp(19px,5.5vw,28px); color:var(--gold); margin-bottom:24px;
    text-shadow:0 0 16px rgba(255,201,60,.5); line-height:1.3;}
  .wa-btn{display:inline-flex; align-items:center; gap:10px; padding:18px 30px; border-radius:20px; border:0;
    background:linear-gradient(180deg,#2fe374,#128c4a); color:#fff; font-family:'Bungee',cursive; font-size:clamp(15px,4.2vw,19px);
    box-shadow:0 8px 0 #0b5a30, 0 12px 24px rgba(37,211,102,.4); cursor:pointer; text-decoration:none;
    animation:waPulse 1.7s ease-in-out infinite;}
  @keyframes waPulse{
    0%,100%{transform:scale(1); box-shadow:0 8px 0 #0b5a30, 0 12px 24px rgba(37,211,102,.4);}
    50%{transform:scale(1.06); box-shadow:0 8px 0 #0b5a30, 0 16px 34px rgba(37,211,102,.65);}
  }
  .wa-close{margin-top:24px; background:none; border:2px solid rgba(255,255,255,.3); color:var(--gold-dim);
    padding:10px 22px; border-radius:14px; font-weight:700; cursor:pointer; font-size:13px;}

  .stage-mode .marquee-title{font-size:clamp(30px,6vw,54px);}
  .stage-mode .lb-name{font-size:20px;}
  .stage-mode .lb-score{font-size:20px;width:60px;}
  .stage-mode .lb-rank{width:38px;height:38px;font-size:16px;}
  .stage-mode .controls-hidden{display:none;}

  .rank-tag{font-size:13px;color:var(--gold-dim);}
  .follow-btn{
    display:inline-block;
    font-family:'Bungee',cursive;
    font-size:14px;
    letter-spacing:0.5px;
    padding:14px 26px;
    border-radius:18px;
    background:linear-gradient(180deg,#e2ff9a,var(--green));
    color:#1c2a00;
    text-decoration:none;
    box-shadow:0 6px 0 #5d8a00, 0 9px 0 rgba(0,0,0,.45), 0 12px 26px rgba(182,255,46,.3);
  }
  .follow-btn:active{transform:translateY(5px);box-shadow:0 1px 0 #5d8a00, 0 3px 0 rgba(0,0,0,.45);}

  /* Fascia pubblicitaria fissa in fondo (come nel quiz): promuove il noleggio dell'app,
     visibile solo a chi gioca/guarda, mai nella dashboard del presentatore. */
  #promoBanner{display:none; position:fixed; left:0; right:0; bottom:0; z-index:9996;
    background:linear-gradient(90deg,#1a0f2e,#2a1650); border-top:2px solid var(--gold);
    padding:6px 10px; text-align:center; font-family:'Outfit'; font-weight:700; font-size:clamp(10px,2.5vw,13px);
    color:#e8e0f5; box-shadow:0 -4px 14px rgba(0,0,0,.5); line-height:1.35;}
  #promoBanner b{color:var(--gold);}
  #promoBanner a{color:var(--cyan); text-decoration:underline; font-weight:800;}
  body.hasPromoBanner .screen{padding-bottom:60px;}
  body.hasPromoBanner .dash-body{padding-bottom:60px;}

  /* Overlay neon a schermo intero per inizio/fine sfida */
  .neon-overlay{
    position:fixed;inset:0;z-index:999;
    display:flex;align-items:center;justify-content:center;
    background:rgba(6,17,22,0.88);
    animation:overlayIn .25s ease;
  }
  .neon-overlay .neon-text{
    font-family:'Fredoka',sans-serif;font-weight:700;
    font-size:clamp(38px,11vw,84px);
    text-align:center;line-height:1.1;padding:0 16px;
    animation:neonBlink 0.85s ease-in-out infinite;
  }
  .neon-overlay.gold .neon-text{
    color:var(--gold);
    text-shadow:0 0 8px var(--gold),0 0 24px var(--gold),0 0 60px rgba(232,184,78,0.8),0 0 110px rgba(232,184,78,0.5);
  }
  .neon-overlay.red .neon-text{
    color:var(--red);
    text-shadow:0 0 8px var(--red),0 0 24px var(--red),0 0 60px rgba(255,71,87,0.8),0 0 110px rgba(255,71,87,0.5);
  }
  @keyframes neonBlink{
    0%,100%{opacity:1;transform:scale(1);}
    50%{opacity:0.45;transform:scale(1.04);}
  }
  @keyframes overlayIn{from{opacity:0;}to{opacity:1;}}
  @media (prefers-reduced-motion: reduce){ .neon-overlay .neon-text{animation:none;} }

  .neon-overlay{
    position:fixed; inset:0; z-index:999;
    display:flex; align-items:center; justify-content:center;
    background:rgba(6,17,22,0.82);
    pointer-events:none;
    animation:overlayFade 4s ease forwards;
  }
  .neon-overlay .neon-text{
    font-family:'Fredoka',sans-serif; font-weight:700;
    font-size:clamp(40px,12vw,90px);
    text-align:center; line-height:1.1; padding:0 16px;
    animation:neonPulse 0.7s ease-in-out infinite alternate;
  }
  .neon-gold{ color:#ffe9b0;
    text-shadow:0 0 8px var(--gold),0 0 22px var(--gold),0 0 48px var(--gold),0 0 90px #ff9d00; }
  .neon-red{ color:#ffd7dc;
    text-shadow:0 0 8px var(--red),0 0 22px var(--red),0 0 48px var(--red),0 0 90px #ff0022; }
  @keyframes neonPulse{
    from{ opacity:1; transform:scale(1); }
    to{ opacity:0.55; transform:scale(1.06); }
  }
  @keyframes overlayFade{
    0%{ opacity:0; } 8%{ opacity:1; } 82%{ opacity:1; } 100%{ opacity:0; }
  }
  .link-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
  a.link{color:var(--gold);word-break:break-all;font-size:12px;}
  .hint{font-size:12px;color:var(--cream);opacity:0.6;}
</style>

<body>
<div id="app"></div>
<div id="promoBanner"></div>
<script>
/* ---------- Storage: Firebase Realtime Database ----------
   kvdb.io e jsonblob.com si sono rivelati inaffidabili per l'uso diretto da
   browser (il primo richiede ora una vera verifica email; il secondo blocca
   le richieste multi-origine). Firebase Realtime Database di Google supporta
   nativamente le richieste dirette da pagine web via REST (basta aggiungere
   ".json" a qualsiasi indirizzo del database), proprio perché è pensato per
   essere usato così da app web e mobile. Richiede un database Firebase
   gratuito creato una tantum dal presentatore (account Google, "modalità di
   prova" = lettura/scrittura pubblica). Tutta la serata vive in un unico
   percorso JSON dentro quel database. */
let lastStorageError = null;

/* ---------- Configurazione fissa ----------
   L'indirizzo del database Firebase del presentatore è incorporato qui, una
   volta per tutte: così il codice della serata resta di soli 5 caratteri,
   dettabile a voce. Per usare un database diverso basta modificare questa
   riga (o usare il campo nelle impostazioni avanzate della creazione serata). */
const DEFAULT_DB_URL = 'https://karaoke-d0484-default-rtdb.europe-west1.firebasedatabase.app';

/* Indirizzo web pubblico dove è pubblicata questa app (Netlify): il QR di
   default diventa così un vero link cliccabile con il codice già incluso. */
const APP_PUBLIC_URL = 'https://capone-hq-2026.vercel.app/karaoke/';

function normalizeDbUrl(url){
  return String(url || '').trim().replace(/\/+$/, '');
}

async function fbGet(dbUrl, path){
  try{
    const res = await fetch(`${dbUrl}/${path}.json`);
    if(!res.ok) throw new Error('HTTP ' + res.status);
    lastStorageError = null;
    const data = await res.json();
    return data; // null se il percorso non esiste ancora
  }catch(e){
    lastStorageError = (e && e.message) ? e.message : String(e);
    return null;
  }
}
async function fbSet(dbUrl, path, value){
  try{
    const res = await fetch(`${dbUrl}/${path}.json`, {
      method: 'PUT',
      body: JSON.stringify(value)
    });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    lastStorageError = null;
    return true;
  }catch(e){
    lastStorageError = (e && e.message) ? e.message : String(e);
    return null;
  }
}
async function fbDelete(dbUrl, path){
  try{
    await fetch(`${dbUrl}/${path}.json`, { method: 'DELETE' });
    return true;
  }catch(e){ return null; }
}
function sleep(ms){ return new Promise(res => setTimeout(res, ms)); }

/* Configurazione WebRTC per l'audio "in onda": server STUN pubblici di Google
   più un relay TURN gratuito come riserva per le reti mobili più restrittive. */
const RTC_CONFIG = { iceServers: [
  { urls: 'stun:stun.l.google.com:19302' },
  { urls: 'stun:stun1.l.google.com:19302' },
  { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
  { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' }
]};

/* Mostra a schermo intero una scritta neon lampeggiante per qualche secondo */
function showNeonOverlay(text, color, durationMs){
  const existing = document.getElementById('neonOverlay');
  if(existing) existing.remove();
  const el = document.createElement('div');
  el.id = 'neonOverlay';
  el.className = 'neon-overlay ' + (color === 'red' ? 'red' : 'gold');
  el.innerHTML = '<div class="neon-text">' + escapeHtml(text) + '</div>';
  el.onclick = () => el.remove();
  document.body.appendChild(el);
  setTimeout(() => { if(el.parentNode) el.remove(); }, durationMs || 4000);
}

/* Mostra una scritta neon gigante a tutto schermo per ~4 secondi. */
function showNeonOverlay(text, colorClass){
  const old = document.getElementById('neonOverlay');
  if(old) old.remove();
  const div = document.createElement('div');
  div.id = 'neonOverlay';
  div.className = 'neon-overlay';
  div.innerHTML = `<div class="neon-text ${colorClass}">${escapeHtml(text)}</div>`;
  document.body.appendChild(div);
  setTimeout(() => div.remove(), 4200);
}

function genCode(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let out = '';
  for(let i=0;i<5;i++) out += chars[Math.floor(Math.random()*chars.length)];
  return out;
}

// Il codice condiviso con i partecipanti combina il codice breve della serata
// e l'indirizzo del database Firebase da usare, così basta un solo codice.
// Il codice breve (5 caratteri) usa il database incorporato nell'app.
// Per compatibilità, un codice lungo "ID|https://..." specifica il database.
function packCode(sessionId, dbUrl){
  return (dbUrl && dbUrl !== DEFAULT_DB_URL) ? (sessionId + '|' + dbUrl) : sessionId;
}
function unpackCode(code){
  const idx = code.indexOf('|');
  if(idx === -1) return { sessionId: code.toUpperCase(), dbUrl: DEFAULT_DB_URL };
  return { sessionId: code.slice(0, idx).toUpperCase(), dbUrl: code.slice(idx + 1) };
}

/* ---------- Helpers: misc ---------- */
function uid(){
  return (crypto && crypto.randomUUID) ? crypto.randomUUID() : 'p-' + Math.random().toString(36).slice(2) + Date.now();
}
function escapeHtml(s){
  return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function sparkline(arr, w, h){
  w = w || 80; h = h || 26;
  if(!arr || !arr.length) return `<svg width="${w}" height="${h}"></svg>`;
  const max = Math.max(...arr, 0.02);
  const step = w / ((arr.length - 1) || 1);
  const pts = arr.map((v,i) => `${(i*step).toFixed(1)},${(h - (v/max)*h*0.9 - h*0.05).toFixed(1)}`).join(' ');
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline points="${pts}" fill="none" stroke="#E8B84E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
function computeScore(participantEnv, presenterEnv){
  if(!participantEnv || !presenterEnv || !participantEnv.length || !presenterEnv.length) return 0;
  const n = Math.min(participantEnv.length, presenterEnv.length, 10);
  const pArr = participantEnv.slice(-n);
  const rArr = presenterEnv.slice(-n);
  const norm = arr => { const m = Math.max(...arr, 0.02); return arr.map(v => v/m); };
  const pN = norm(pArr), rN = norm(rArr);
  let diffSum = 0;
  for(let i=0;i<n;i++) diffSum += Math.abs(pN[i]-rN[i]);
  const avgDiff = diffSum/n;
  return Math.round(Math.max(0, 1-avgDiff)*100);
}
function micErrorMessage(e){
  const insecure = (location.protocol !== 'https:' && location.hostname !== 'localhost');
  if(insecure){
    return "Il microfono è bloccato perché la pagina non è aperta da un indirizzo https:// (i browser lo permettono solo ai siti sicuri, non ai file aperti dai Download). Serve il link della serata pubblicato dal presentatore.";
  }
  const name = e && e.name;
  if(name === 'NotAllowedError' || name === 'PermissionDeniedError'){
    return "Permesso negato. Tocca l'icona del lucchetto vicino all'indirizzo, consenti il microfono per questo sito e riprova.";
  }
  if(name === 'NotFoundError' || name === 'DevicesNotFoundError'){
    return "Nessun microfono trovato su questo dispositivo.";
  }
  if(name === 'NotReadableError'){
    return "Il microfono risulta già in uso da un'altra app. Chiudila e riprova.";
  }
  return "Impossibile accedere al microfono (" + (e && e.message ? e.message : 'errore sconosciuto') + ").";
}

/* ---------- Mic engine ---------- */
class MicMeter{
  constructor(canvas, onLevel){
    this.canvas = canvas;
    this.ctx = canvas ? canvas.getContext('2d') : null;
    this.onLevel = onLevel || function(){};
    this.stream = null; this.audioCtx = null; this.analyser = null;
    this.freqData = null; this.timeData = null; this.rafId = null;
    this.currentRMS = 0; this.active = false;
  }
  async start(){
    // Modalità microfono standard: la modalità "grezza" (senza guadagno
    // automatico) satura il segnale su alcuni telefoni, quindi la evitiamo.
    // Il confronto delle onde è comunque normalizzato, perciò l'elaborazione
    // di sistema non falsa la classifica.
    this.stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const source = this.audioCtx.createMediaStreamSource(this.stream);
    this.analyser = this.audioCtx.createAnalyser();
    this.analyser.fftSize = 256;
    source.connect(this.analyser);
    this.freqData = new Uint8Array(this.analyser.frequencyBinCount);
    this.timeData = new Uint8Array(this.analyser.fftSize);
    this.active = true;
    this._loop();
  }
  _loop(){
    if(!this.active) return;
    this.rafId = requestAnimationFrame(() => this._loop());
    this.analyser.getByteTimeDomainData(this.timeData);
    this.analyser.getByteFrequencyData(this.freqData);
    let sum = 0;
    for(let i=0;i<this.timeData.length;i++){ const v = (this.timeData[i]-128)/128; sum += v*v; }
    this.currentRMS = Math.sqrt(sum/this.timeData.length);
    this.onLevel(this.currentRMS);
    if(this.ctx) this._draw();
  }
  _draw(){
    const ctx = this.ctx, w = this.canvas.width, h = this.canvas.height;
    ctx.clearRect(0,0,w,h);
    const barCount = 32;
    const step = Math.max(1, Math.floor(this.freqData.length/barCount));
    const barW = (w/barCount) * 0.6;
    const gap = (w/barCount) * 0.4;
    ctx.fillStyle = '#E8B84E';
    for(let i=0;i<barCount;i++){
      let s = 0;
      for(let j=0;j<step;j++) s += this.freqData[i*step+j] || 0;
      const avg = (s/step)/255;
      const barH = Math.max(2, avg*h);
      const x = i*(barW+gap) + gap/2;
      ctx.fillRect(x, h-barH, barW, barH);
    }
  }
  stop(){
    this.active = false;
    if(this.rafId) cancelAnimationFrame(this.rafId);
    if(this.stream) this.stream.getTracks().forEach(t => t.stop());
    if(this.audioCtx && this.audioCtx.state !== 'closed') this.audioCtx.close();
  }
}

/* ---------- App state ---------- */
const App = {
  view: 'home', code: null, dbUrl: null, role: null, name: null, participantId: null,
  presenterName: 'Alberto', mic: null, envelope: [], timers: [],
  stageMode: false, muted: false,
  initCode: (new URLSearchParams(location.search)).get('code') || ''
};

function clearTimers(){ App.timers.forEach(id => clearInterval(id)); App.timers = []; }
function stopMic(){ if(App.mic){ App.mic.stop(); App.mic = null; } }
function cleanupView(){ clearTimers(); stopMic(); }
function goto(view){ cleanupView(); App.view = view; render(); }

/* Struttura dati ristrutturata per scalare:
   - karaoke_CODICE/board : il "tabellone" compatto, scritto SOLO dal presentatore
     (brano, stato gara, vincitori, classifica già calcolata, silenziati)
   - karaoke_CODICE/p/ID  : il nodo personale di ogni partecipante, scritto SOLO da lui
     (nome + ultime onde vocali)
   Così nessuno sovrascrive i dati degli altri e ogni telefono scambia pochi
   byte: il grosso (le onde di tutti) lo scarica solo il presentatore. */
function emptyBoard(name){
  return {
    songName: 'In attesa del primo brano…',
    presenterName: name,
    mutedIds: [],
    contestActive: false,
    wins: {},
    lastWinner: null,
    standings: [],
    onAir: [],
    waGroup: { on: false, title: '', link: '' },
    updatedAt: Date.now()
  };
}

/* Il PIN non è scritto in chiaro nel codice: viene salvata solo la sua
   "impronta" (hash SHA-256), confrontata con quella di ciò che si digita. */
const ADMIN_PIN_HASH = '6130bead2122e5ed59c9967e718b1a6c976f6c884d65fc63b7504427ff33dc75';

async function sha256Hex(text){
  const data = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

    <div class="screen">

  document.getElementById('btnEnd').onclick = () => { App.code=null; App.dbUrl=null; App.role=null; goto('home'); };

  // Gruppo WhatsApp: stessa logica del quiz (locali salvati in localStorage,
  // riutilizzabili anche dall'app Quiz sullo stesso telefono/browser).
  function waSavedList(){
    try{ return JSON.parse(localStorage.getItem('capone_wa_saved') || '[]'); }catch(e){ return []; }
  }
  function waSaveEntry(title, link){
    if(!title || !link) return;
    const list = waSavedList();
    const i = list.findIndex(e => e.title === title);
    if(i >= 0) list[i].link = link; else list.push({ title, link });
    try{ localStorage.setItem('capone_wa_saved', JSON.stringify(list)); }catch(e){}
  }
  function renderWaSaved(){
    const wrap = document.getElementById('waSavedWrap');
    if(!wrap) return;
    const list = waSavedList();
    if(!list.length){ wrap.innerHTML = ''; return; }
    wrap.innerHTML = `
      <label class="label">Locali già salvati</label>
      <select class="input" id="waSavedSel" style="margin-bottom:8px;">
        <option value="">— scegli un locale già salvato —</option>
        ${list.map(e => `<option value="${escapeHtml(e.title)}">${escapeHtml(e.title)}</option>`).join('')}
      </select>`;
    document.getElementById('waSavedSel').onchange = (e) => {
      const entry = list.find(x => x.title === e.target.value);
      if(entry){ document.getElementById('waTitleIn').value = entry.title; document.getElementById('waLinkIn').value = entry.link; }
    };
  }

    document.getElementById('waTitleIn').value = localStorage.getItem('capone_wa_title') || '';

  document.getElementById('btnWaShow').onclick = async () => {
    const waMsg = document.getElementById('waMsg');

    const title = document.getElementById('waTitleIn').value.trim();
    const link = document.getElementById('waLinkIn').value.trim();
    if(!title || !link){ waMsg.textContent = 'Scrivi sia il titolo che il link del gruppo!'; return; }
    if(!/^https:\/\/(chat\.whatsapp\.com|wa\.me)\//.test(link)){ waMsg.textContent = 'Il link non sembra un vero link di invito WhatsApp (deve iniziare con https://chat.whatsapp.com/...).'; return; }
    try{ localStorage.setItem('capone_wa_title', title); localStorage.setItem('capone_wa_link', link); }catch(e){}
    waSaveEntry(title, link);
    renderWaSaved();
    board.waGroup = { on: true, title, link };
    await publishBoard();
  };

    if(standings.length){
      const winner = standings[0];
      board.wins = board.wins || {};
      board.wins[winner.id] = (board.wins[winner.id] || 0) + 1;
      board.lastWinner = { id: winner.id, name: winner.name, at: Date.now() };
    }
    await publishBoard();
    refreshUi();
  };

  const songInput = document.getElementById('songName');
  document.getElementById('btnSong').onclick = async () => {

    board.songName = val;

      const sampleTimer = setInterval(() => {
        if(App.mic){ presenterEnv.push(Number(App.mic.currentRMS.toFixed(3))); if(presenterEnv.length>40) presenterEnv.shift(); }
      }, 300);
      App.timers.push(sampleTimer);
    }catch(e){
      micStatus.textContent = micErrorMessage(e);
    }
  };

  let lastParticipants = {};

  function refreshUi(){
    const participants = lastParticipants;
    const mutedIds = board.mutedIds || [];
    const wins = board.wins || {};

    document.getElementById('songDisplay').textContent = '🎵 ' + (board.songName || '—');

    const contestStatus = document.getElementById('contestStatus');
    if(contestStatus) contestStatus.textContent = board.contestActive ? '🏁 Gara in corso!' : 'Gara non attiva';
    const winnerBanner = document.getElementById('winnerBanner');
    if(winnerBanner){
      if(!board.contestActive && board.lastWinner){
        winnerBanner.innerHTML = `<div class="song-banner" style="border-color:#5FB88B;"><h2 class="marquee-title display" style="font-size:clamp(18px,5vw,26px);">🏆 Vince ${escapeHtml(board.lastWinner.name)}!</h2></div>`;
      } else if(board.contestActive){
        winnerBanner.innerHTML = `<div class="banner-muted" style="border-color:var(--gold);color:var(--gold);">🏁 GARA IN CORSO</div>`;
      } else {
        winnerBanner.innerHTML = '';
      }
    }

    const list = Object.keys(participants).map(id => {
      const data = participants[id] || {};
      const score = computeScore(data.envelope, presenterEnv.slice(-10));
      return { id, name: data.name || '?', envelope: data.envelope || [], score, muted: mutedIds.includes(id), wins: wins[id] || 0, onAir: (board.onAir || []).includes(id) };
    }).sort((a,b) => b.score - a.score);

    // Classifica compatta pubblicata per i partecipanti (senza onde: pochi byte)
    board.standings = list.map(p => ({ id: p.id, name: p.name, score: p.score }));

    const lb = document.getElementById('leaderboard');
    if(!list.length){
      lb.innerHTML = '<p class="hint">In attesa di partecipanti…</p>';
    } else {
      lb.innerHTML = list.map((p, i) => `
        <div class="lb-row ${i===0 ? 'top1' : ''}">
          <div class="lb-rank">${i+1}</div>
          <div class="lb-name">${escapeHtml(p.name)}${p.wins ? ' <span style="color:var(--gold);">🏆×' + p.wins + '</span>' : ''}${p.onAir ? ' <span style="color:var(--green);">📢</span>' : ''}</div>

          <button class="mute-btn controls-hidden ${p.muted ? 'on' : ''}" data-id="${p.id}" title="Silenzia/riattiva">${p.muted ? '🔇' : '🎤'}</button>
        </div>`).join('');
      lb.querySelectorAll('.mute-btn').forEach(btn => {
        btn.onclick = async () => {
          const id = btn.getAttribute('data-id');
          const set = new Set(board.mutedIds || []);
          if(set.has(id)) set.delete(id); else set.add(id);
          board.mutedIds = Array.from(set);
          await publishBoard();
          refreshUi();
        };
      });
      lb.querySelectorAll('.air-btn').forEach(btn => {
        btn.onclick = async () => {
          const id = btn.getAttribute('data-airid');
          let onAir = (board.onAir || []).slice();
          if(onAir.includes(id)){
            onAir = onAir.filter(x => x !== id);
          } else {
            onAir.push(id); // nessun tetto: per i giochi a squadre si possono aprire tutti
          }
          board.onAir = onAir;
          await publishBoard();
          refreshUi();
        };
      });
    }

    const winsBoardEl = document.getElementById('winsBoard');
    if(winsBoardEl){
      const winsList = Object.keys(wins)
        .map(id => ({ id, count: wins[id], name: (participants[id] && participants[id].name) || (board.lastWinner && board.lastWinner.id === id ? board.lastWinner.name : 'Partecipante uscito') }))
        .filter(w => w.count > 0)
        .sort((a,b) => b.count - a.count);
      if(!winsList.length){
        winsBoardEl.innerHTML = '<p class="hint">Nessuna gara conclusa finora.</p>';
      } else {
        winsBoardEl.innerHTML = winsList.map((w, i) => `
          <div class="lb-row ${i===0 ? 'top1' : ''}">
            <div class="lb-rank">${i+1}</div>
            <div class="lb-name">${escapeHtml(w.name)}</div>
            <div class="lb-score mono">🏆×${w.count}</div>
          </div>`).join('');
      }
    }
  }

  async function pollLoop(){
    // Il presentatore è l'unico che scarica le onde di tutti (nodo /p),
    // calcola la classifica e pubblica il tabellone compatto.
    const participants = await fbGet(dbUrl, path + '/p');
    lastParticipants = participants || {};
    refreshUi();
    await publishBoard();
  }
  publishBoard();
  pollLoop();
  App.timers.push(setInterval(pollLoop, 2000));
}

      </div>

    navigator.clipboard?.writeText(shareCode).then(() => {
      document.getElementById('btnCopyCode').textContent = 'Copiato ✓';
    }).catch(() => {});
  };
  document.getElementById('btnTestLink').onclick = () => {
    window.open(joinLink, '_blank');
  };
  document.getElementById('btnShareLink').onclick = async () => {
    const shareData = { title: 'KARAOKE CON ALBERTO, LA SFIDA!', text: 'Inquadra ed entra in gara! 🎤 Codice: ' + shareCode, url: joinLink };
    if(navigator.share && navigator.canShare && navigator.canShare(shareData)){

    } else {
      navigator.clipboard?.writeText(joinLink).then(() => {
        document.getElementById('btnShareLink').textContent = 'Link copiato ✓';
      }).catch(() => {});
    }
  };
  document.getElementById('btnShareQr').onclick = () => shareQrImage(shareCode, joinLink);

/* Genera un'immagine grande e brandizzata (titolo + QR + codice) e la
   condivide con la scheda di condivisione del telefono (WhatsApp incluso).
   Se la condivisione file non è supportata, la scarica come PNG. */
async function shareQrImage(shareCode, joinLink){
  const statusEl = document.getElementById('shareStatus');
  const setStatus = t => { if(statusEl) statusEl.textContent = t; };
  setStatus('Preparo l\'immagine…');

  // 1) Genera un QR grande in un contenitore nascosto
  const hidden = document.createElement('div');
  hidden.style.position = 'fixed'; hidden.style.left = '-9999px';
  document.body.appendChild(hidden);
  try{ new QRCode(hidden, { text: joinLink, width: 600, height: 600 }); }
  catch(e){ document.body.removeChild(hidden); setStatus('Impossibile generare il QR.'); return; }
  // La libreria disegna in un canvas (o img) dentro il contenitore
  await new Promise(r => setTimeout(r, 120));
  const qrCanvas = hidden.querySelector('canvas');
  const qrImg = hidden.querySelector('img');

  // 2) Componi il poster su un canvas grande
  const W = 1080, H = 1500;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const ctx = c.getContext('2d');

  // sfondo
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#14313A'); bg.addColorStop(1, '#061116');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

  // titolo
  ctx.textAlign = 'center';
  ctx.fillStyle = '#E8B84E';
  ctx.font = '700 92px Fredoka, sans-serif';
  ctx.fillText('KARAOKE', W/2, 130);
  ctx.fillText('CON ALBERTO', W/2, 230);
  ctx.fillStyle = '#FF4757';
  ctx.font = '700 72px Fredoka, sans-serif';
  ctx.fillText('LA SFIDA!', W/2, 315);
  ctx.fillStyle = '#E8B84E';

  // riquadro bianco con QR
  const qrSize = 640;
  const qrX = (W - qrSize) / 2, qrY = 375;
  ctx.fillStyle = '#ffffff';
  const pad = 34;
  if(ctx.roundRect){
    ctx.beginPath();
    ctx.roundRect(qrX - pad, qrY - pad, qrSize + pad*2, qrSize + pad*2, 36);
    ctx.fill();
  } else {
    ctx.fillRect(qrX - pad, qrY - pad, qrSize + pad*2, qrSize + pad*2);
  }
  const qrSource = (qrCanvas || qrImg);
  if(qrSource) ctx.drawImage(qrSource, qrX, qrY, qrSize, qrSize);

  // istruzione + codice
  ctx.fillStyle = '#F5EEDC';
  ctx.font = '600 46px Fredoka, sans-serif';
  ctx.fillText('Inquadra ed entra in gara! 🎤', W/2, qrY + qrSize + 130);
  ctx.fillStyle = '#E8B84E';
  ctx.font = '700 96px "Space Mono", monospace';
  ctx.fillText(shareCode, W/2, qrY + qrSize + 270);

  document.body.removeChild(hidden);

  // 3) Condividi come file, con fallback al download
  c.toBlob(async (blob) => {
    if(!blob){ setStatus('Errore nella creazione dell\'immagine.'); return; }
    const file = new File([blob], 'karaoke-con-alberto-qr.png', { type: 'image/png' });
    if(navigator.canShare && navigator.canShare({ files: [file] })){
      try{
        await navigator.share({ files: [file], title: 'KARAOKE CON ALBERTO, LA SFIDA!', text: 'Inquadra il QR ed entra in gara! Codice: ' + shareCode });
        setStatus('');
        return;
      }catch(e){ /* condivisione annullata o non riuscita: si passa al download */ }
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'karaoke-con-alberto-qr.png';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setStatus('Immagine scaricata: la trovi nei Download, pronta da inviare.');
  }, 'image/png');
}

/* ---------- Trasmissione "in onda" (lato partecipante) ----------
   Quando la regia mette in onda questo partecipante, il telefono apre un
   collegamento WebRTC diretto verso il computer della regia: l'audio viaggia
   da telefono a computer senza passare dal database (Firebase serve solo a
   scambiare i messaggi di aggancio iniziali). */
let rtcState = null;

async function startBroadcast(path){
  if(rtcState || !App.mic || !App.mic.stream) return;
  const base = path + '/rtc/' + App.participantId;
  const pc = new RTCPeerConnection(RTC_CONFIG);
  let candIdx = 0;
  rtcState = { pc, timer: null, gotAnswer: false, seenAnswerCands: {} };

  App.mic.stream.getAudioTracks().forEach(t => pc.addTrack(t, App.mic.stream));
  pc.onicecandidate = (e) => {
    if(e.candidate) fbSet(App.dbUrl, base + '/oc/c' + (candIdx++), e.candidate.toJSON());
  };
  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  await fbDelete(App.dbUrl, base + '/answer');
  await fbDelete(App.dbUrl, base + '/ac');
  await fbSet(App.dbUrl, base + '/offer', { type: offer.type, sdp: offer.sdp, at: Date.now() });

  rtcState.timer = setInterval(async () => {
    if(!rtcState) return;
    if(!rtcState.gotAnswer){
      const answer = await fbGet(App.dbUrl, base + '/answer');
      if(answer && answer.sdp){
        try{
          await pc.setRemoteDescription(new RTCSessionDescription({ type: 'answer', sdp: answer.sdp }));
          rtcState.gotAnswer = true;
        }catch(e){ console.error(e); }
      }
    }
    const cands = await fbGet(App.dbUrl, base + '/ac');
    if(cands){
      for(const k of Object.keys(cands)){
        if(!rtcState.seenAnswerCands[k]){
          rtcState.seenAnswerCands[k] = true;
          try{ await pc.addIceCandidate(new RTCIceCandidate(cands[k])); }catch(e){}
        }
      }
    }
  }, 1500);
  App.timers.push(rtcState.timer);
}

async function stopBroadcast(path){
  if(!rtcState) return;
  clearInterval(rtcState.timer);
  try{ rtcState.pc.close(); }catch(e){}
  rtcState = null;
  await fbDelete(App.dbUrl, path + '/rtc/' + App.participantId);
}

/* ---------- Regia audio (lato computer) ----------
   Pagina da aprire sul computer collegato alle casse: riceve via WebRTC le
   voci dei partecipanti messi in onda e le riproduce. */
function renderRegia(){
  document.getElementById('app').innerHTML = `
    <div class="screen">
      <h1 class="marquee-title display" style="font-size:28px;">REGIA AUDIO</h1>
      <div class="card" id="regiaSetup">
        <label class="label">Codice della serata</label>
        <input class="input mono" id="regiaCode" maxlength="10" placeholder="ES. A59RX" autocapitalize="characters" autocomplete="off" style="font-size:26px;letter-spacing:6px;text-transform:uppercase;">
        <button class="btn btn-primary" id="btnRegiaGo">🔊 Avvia la regia</button>
        <p class="hint" id="regiaError" style="color:var(--red);"></p>
        <p class="hint">Apri questa pagina sul computer collegato alle casse. Le voci messe in onda dal presentatore (📢) usciranno da qui.</p>
      </div>
      <div id="regiaLive" style="display:none;width:100%;max-width:520px;">
        <div class="card" style="max-width:none;">
          <label class="label">In onda adesso</label>
          <div id="airList"><p class="hint air-empty">Nessuno in onda. Usa 📢 nella classifica del presentatore.</p></div>
        </div>
      </div>
      <button class="btn btn-ghost" style="max-width:420px;" id="btnBack">← Indietro</button>
    </div>`;
  document.getElementById('btnBack').onclick = () => goto('home');

  const conns = {}; // id -> { pc, audio, seenOfferCands, name }

  let audioCtx = null;

  async function ensureConn(id, name, path){
    if(conns[id]) return;
    const base = path + '/rtc/' + id;
    const offer = await fbGet(App.dbUrl, base + '/offer');
    if(!offer || !offer.sdp) return; // il telefono non ha ancora pubblicato l'aggancio
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const pc = new RTCPeerConnection(RTC_CONFIG);
    let candIdx = 0;
    // Elemento audio silenziato: serve solo a "tenere vivo" il flusso; il suono
    // vero passa dal nodo di guadagno regolabile del mixer.
    const audio = new Audio();
    audio.autoplay = true;
    audio.muted = true;
    const gain = audioCtx.createGain();
    gain.gain.value = 1;
    gain.connect(audioCtx.destination);
    conns[id] = { pc, audio, gain, seenOfferCands: {}, name, row: null };
    addRow(id, name);
    pc.ontrack = (e) => {
      audio.srcObject = e.streams[0];
      audio.play().catch(() => {});
      try{
        const src = audioCtx.createMediaStreamSource(e.streams[0]);
        src.connect(conns[id].gain);
      }catch(err){ console.error(err); }
    };
    pc.onicecandidate = (e) => {
      if(e.candidate) fbSet(App.dbUrl, base + '/ac/c' + (candIdx++), e.candidate.toJSON());
    };
    try{
      await pc.setRemoteDescription(new RTCSessionDescription({ type: 'offer', sdp: offer.sdp }));
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
      await fbSet(App.dbUrl, base + '/answer', { type: answer.type, sdp: answer.sdp, at: Date.now() });
    }catch(e){ console.error(e); }
  }

  function dropConn(id){
    const c = conns[id];
    if(!c) return;
    try{ c.pc.close(); }catch(e){}
    try{ c.audio.srcObject = null; }catch(e){}
    try{ c.gain.disconnect(); }catch(e){}
    if(c.row && c.row.parentNode) c.row.remove();
    delete conns[id];
    updateEmptyHint();
  }

  function updateEmptyHint(){
    const airList = document.getElementById('airList');
    if(!airList) return;
    const hint = airList.querySelector('.air-empty');
    const hasRows = airList.querySelector('.air-row');
    if(hasRows){ if(hint) hint.style.display = 'none'; }
    else { if(hint) hint.style.display = ''; }
  }

  function addRow(id, name){
    const airList = document.getElementById('airList');
    if(!airList) return;
    const row = document.createElement('div');
    row.className = 'lb-row air-row';
    row.style.flexWrap = 'wrap';
    row.innerHTML = `
      <div class="lb-name">📢 ${escapeHtml(name)}</div>
      <div class="lb-score mono air-status" style="width:auto;color:var(--gold-dim);">aggancio…</div>
      <div style="flex-basis:100%;display:flex;align-items:center;gap:10px;">
        <span class="hint" style="white-space:nowrap;">🔊 Volume</span>
        <input type="range" min="0" max="200" value="100" style="flex:1;accent-color:var(--gold);">
        <span class="mono hint air-vol" style="width:44px;text-align:right;">100%</span>
      </div>`;
    const slider = row.querySelector('input[type=range]');
    const volLabel = row.querySelector('.air-vol');
    slider.oninput = () => {
      const v = Number(slider.value);
      volLabel.textContent = v + '%';
      if(conns[id]) conns[id].gain.gain.value = v / 100;
    };
    airList.appendChild(row);
    conns[id].row = row;
    updateEmptyHint();
  }

  document.getElementById('btnRegiaGo').onclick = async () => {
    const err = document.getElementById('regiaError');
    err.textContent = '';
    const raw = document.getElementById('regiaCode').value.trim();
    if(!raw){ err.textContent = 'Inserisci il codice della serata.'; return; }
    const { sessionId, dbUrl } = unpackCode(raw);
    const path = 'karaoke_' + sessionId;
    const boardData = await fbGet(dbUrl, path + '/board');
    if(!boardData){ err.textContent = 'Codice non trovato: controlla e riprova.'; return; }
    App.code = sessionId; App.dbUrl = dbUrl;
    document.getElementById('regiaSetup').style.display = 'none';
    document.getElementById('regiaLive').style.display = '';

    const loop = setInterval(async () => {
      const board = await fbGet(App.dbUrl, path + '/board');
      if(!board) return;
      const onAir = board.onAir || [];
      const names = {};
      (board.standings || []).forEach(s => { names[s.id] = s.name; });

      // apro le connessioni per chi è in onda, chiudo per chi non lo è più
      for(const id of onAir) await ensureConn(id, names[id] || 'Partecipante', path);
      for(const id of Object.keys(conns)) if(!onAir.includes(id)) dropConn(id);

      // raccolgo i candidati di aggancio pubblicati dai telefoni
      for(const id of Object.keys(conns)){
        const cands = await fbGet(App.dbUrl, path + '/rtc/' + id + '/oc');
        if(cands){
          for(const k of Object.keys(cands)){
            if(!conns[id].seenOfferCands[k]){
              conns[id].seenOfferCands[k] = true;
              try{ await conns[id].pc.addIceCandidate(new RTCIceCandidate(cands[k])); }catch(e){}
            }
          }
        }
      }

      // interfaccia: aggiorno solo lo stato, i cursori del volume restano com'erano
      for(const id of Object.keys(conns)){
        const c = conns[id];
        if(!c.row) continue;
        const ok = (c.pc.connectionState === 'connected');
        const statusEl = c.row.querySelector('.air-status');
        if(statusEl){
          statusEl.textContent = ok ? 'IN ONDA' : 'aggancio…';
          statusEl.style.color = ok ? 'var(--green)' : 'var(--gold-dim)';
        }
        c.row.classList.toggle('top1', ok);
      }
    }, 2000);
    App.timers.push(loop);
  };
}

/* ===== SUGGERIMENTI AL PASSAGGIO (data-tip) — motore unico, stesso del quiz =====
   Funziona da solo per QUALSIASI elemento con data-tip="...", presente in pagina o generato dopo
   da altre funzioni (i pannelli di questa app si ridisegnano spesso): non serve richiamare nulla
   elemento per elemento. Passaggio del mouse (desktop) o pressione prolungata (touch). */
(function(){
  const tip = document.createElement('div');
  tip.className = 'tip-bubble';
  document.addEventListener('DOMContentLoaded', () => document.body.appendChild(tip));
  if(document.body) document.body.appendChild(tip);
  let showTimer=null, longPressTimer=null, startX=0, startY=0, moved=false, suppressClick=false;

  function place(x,y){
    const w = window.innerWidth;
    tip.style.left = Math.min(Math.max(x, 80), w-80) + 'px';
    tip.style.top = Math.max(y-14, 40) + 'px';
  }
  function show(text,x,y){ tip.textContent = text; place(x,y); requestAnimationFrame(() => tip.classList.add('show')); }
  function hide(){ tip.classList.remove('show'); }

  // "pointer events" invece dei vecchi mouseover/mouseout: permettono di sapere con certezza se il
  // tocco viene da un vero mouse o da un dito — sui browser mobili un tap genera anche un finto
  // mouseover di compatibilità, che altrimenti farebbe comparire subito il suggerimento invece di
  // aspettare la pressione prolungata pensata apposta per il touch.
  document.addEventListener('pointerover', e => {
    if(e.pointerType !== 'mouse') return;
    const el = e.target.closest('[data-tip]');
    if(!el) return;
    clearTimeout(showTimer);
    showTimer = setTimeout(() => show(el.dataset.tip, e.clientX, e.clientY), 200);
  });
  document.addEventListener('pointermove', e => {
    if(e.pointerType !== 'mouse') return;
    if(!tip.classList.contains('show')) return;
    if(e.target.closest('[data-tip]')) place(e.clientX, e.clientY);
  });
  document.addEventListener('pointerout', e => {
    if(e.pointerType !== 'mouse') return;
    if(e.target.closest('[data-tip]')){ clearTimeout(showTimer); hide(); }
  });

  document.addEventListener('touchstart', e => {
    const el = e.target.closest('[data-tip]');
    if(!el) return;
    moved = false;
    const t = e.touches[0]; startX = t.clientX; startY = t.clientY;
    clearTimeout(longPressTimer);
    longPressTimer = setTimeout(() => {
      if(!moved){ show(el.dataset.tip, startX, startY); suppressClick = true; if(navigator.vibrate) navigator.vibrate(12); }
    }, 420);
  }, {passive:true});
  document.addEventListener('touchmove', e => {
    if(!longPressTimer) return;
    const t = e.touches[0];
    if(Math.abs(t.clientX-startX) > 10 || Math.abs(t.clientY-startY) > 10){ moved = true; clearTimeout(longPressTimer); hide(); }
  }, {passive:true});
  document.addEventListener('touchend', () => { clearTimeout(longPressTimer); if(suppressClick) hide(); });
  document.addEventListener('click', e => {
    if(suppressClick){ e.preventDefault(); e.stopPropagation(); suppressClick = false; }
    clearTimeout(showTimer);
    hide();
  }, true);
})();

  home: renderHome,
  adminPin: renderAdminPin,
  adminCreate: renderAdminCreate,
  adminDashboard: renderAdminDashboard,
  participantJoin: renderParticipantJoin,
  participantMic: renderParticipantMic,
  regia: renderRegia
};
function render(){ (VIEWS[App.view] || renderHome)(); updatePromoBanner(App.view); }

/* Fascia fissa in fondo: promuove il noleggio dell'app stessa. Visibile su
   home/ingresso/gara/regia (chi partecipa o guarda), mai nella dashboard del
   presentatore, che la sta già usando. */
function updatePromoBanner(view){
  const b = document.getElementById('promoBanner');
  if(!b) return;
  const hideOn = ['adminPin', 'adminCreate', 'adminDashboard'];
  if(hideOn.includes(view)){
    b.style.display = 'none';
    document.body.classList.remove('hasPromoBanner');
    return;
  }
  b.innerHTML = `🎤 Noleggia anche solo per una sera <b>KARAOKE - LA SFIDA</b> per il tuo locale o evento. Vai su <a href="https://linktr.ee/Albertoseminerio" target="_blank" rel="noopener">linktr.ee/Albertoseminerio</a>`;
  b.style.display = 'block';
  document.body.classList.add('hasPromoBanner');
}

// Se l'app è aperta da un link con codice (es. dal QR), si va direttamente
// alla schermata ospite con il codice già inserito, senza scelte intermedie.
if(App.initCode){ App.view = 'participantJoin'; }
render();
