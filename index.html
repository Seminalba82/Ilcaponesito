<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IL CAPONE — Quartier Generale</title>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0614;--panel:#1c1033;--magenta:#ff2e9a;--cyan:#00f0ff;--lime:#b6ff2e;--gold:#ffc93c;--viola:#9d4dff;--muted:#b9a8d9;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Outfit',sans-serif;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:26px 18px 50px;
  background:radial-gradient(1200px 600px at 80% -10%,rgba(157,77,255,.28),transparent 60%),
  radial-gradient(900px 500px at 10% 110%,rgba(0,240,255,.18),transparent 60%),
  radial-gradient(700px 400px at 50% 50%,rgba(255,46,154,.10),transparent 70%),var(--bg);}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.35;
  background-image:linear-gradient(rgba(157,77,255,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(157,77,255,.12) 1px,transparent 1px);
  background-size:48px 48px;mask-image:radial-gradient(ellipse at 50% 45%,black 30%,transparent 75%);
  -webkit-mask-image:radial-gradient(ellipse at 50% 45%,black 30%,transparent 75%);}
.logo{width:min(64vw,260px);border-radius:26px;border:3px solid var(--gold);
  box-shadow:0 0 34px rgba(255,201,60,.45),0 14px 30px rgba(0,0,0,.6);animation:float 3.5s ease-in-out infinite;position:relative;z-index:1;}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.brand{font-family:'Bungee';text-align:center;line-height:.95;margin-top:16px;position:relative;z-index:1;}
.t1{font-size:clamp(30px,7vw,56px);color:var(--gold);text-shadow:0 0 18px rgba(255,201,60,.55),0 4px 0 #7a4b00,0 8px 0 #3d2500;}
.t2{font-size:clamp(16px,3.4vw,24px);color:var(--cyan);text-shadow:0 0 14px rgba(0,240,255,.7),0 3px 0 #005e66;letter-spacing:3px;}
.byline{font-weight:700;letter-spacing:4px;text-transform:uppercase;color:var(--muted);font-size:12px;margin:8px 0 30px;position:relative;z-index:1;}
.byline b{color:var(--cyan);}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;width:100%;max-width:760px;min-width:0;align-self:stretch;position:relative;z-index:1;}
a.app{display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:center;text-decoration:none;
  font-family:'Bungee';font-size:20px;padding:28px 18px;border-radius:22px;color:#fff;text-align:center;
  text-shadow:0 3px 0 rgba(0,0,0,.5);transition:transform .1s,box-shadow .1s;}
a.app small{font-family:'Outfit';font-weight:700;font-size:13px;opacity:.9;text-transform:none;letter-spacing:0;text-shadow:none;}
a.app .ico{font-size:44px;filter:drop-shadow(0 4px 0 rgba(0,0,0,.4));}
a.app:active{transform:translateY(7px);}
.quiz{background:linear-gradient(180deg,#ff5db1,var(--magenta));box-shadow:0 9px 0 #8a0050,0 14px 0 rgba(0,0,0,.4),0 0 34px rgba(255,46,154,.45);}
.quiz:active{box-shadow:0 2px 0 #8a0050,0 5px 0 rgba(0,0,0,.4);}
.chat{background:linear-gradient(180deg,#4df6ff,#00c2cf);color:#00232a;text-shadow:none;box-shadow:0 9px 0 #00636e,0 14px 0 rgba(0,0,0,.4),0 0 34px rgba(0,240,255,.45);}
.chat:active{box-shadow:0 2px 0 #00636e,0 5px 0 rgba(0,0,0,.4);}
.karaoke{background:linear-gradient(180deg,#ccff66,#8fd400);color:#1c2a00;text-shadow:none;box-shadow:0 9px 0 #4a7000,0 14px 0 rgba(0,0,0,.4),0 0 34px rgba(182,255,46,.4);}
.karaoke:active{box-shadow:0 2px 0 #4a7000,0 5px 0 rgba(0,0,0,.4);}
.prev{background:linear-gradient(180deg,#ffd76e,#ffab00);color:#2a1a00;text-shadow:none;box-shadow:0 9px 0 #8a5f00,0 14px 0 rgba(0,0,0,.4),0 0 34px rgba(255,201,60,.45);}
.prev:active{box-shadow:0 2px 0 #8a5f00,0 5px 0 rgba(0,0,0,.4);}
.favole{background:linear-gradient(180deg,#c99cff,#9d4dff);box-shadow:0 9px 0 #4d1a8a,0 14px 0 rgba(0,0,0,.4),0 0 34px rgba(157,77,255,.5);}
.favole:active{box-shadow:0 2px 0 #4d1a8a,0 5px 0 rgba(0,0,0,.4);}
.videoproj{background:linear-gradient(180deg,#4dffb8,#00c98a);color:#00291c;text-shadow:none;box-shadow:0 9px 0 #00694a,0 14px 0 rgba(0,0,0,.4),0 0 34px rgba(0,240,180,.4);}
.videoproj:active{box-shadow:0 2px 0 #00694a,0 5px 0 rgba(0,0,0,.4);}
.asta{background:linear-gradient(180deg,#ffd76a,#d4a63a);color:#2a1a00;text-shadow:none;box-shadow:0 9px 0 #6e4e12,0 14px 0 rgba(0,0,0,.4),0 0 34px rgba(212,166,58,.5);}
.asta:active{box-shadow:0 2px 0 #6e4e12,0 5px 0 rgba(0,0,0,.4);}
.ruota{background:linear-gradient(180deg,#ff8a3d,#ff2e9a);box-shadow:0 9px 0 #8a0050,0 14px 0 rgba(0,0,0,.4),0 0 34px rgba(255,138,61,.45);}
.ruota:active{box-shadow:0 2px 0 #8a0050,0 5px 0 rgba(0,0,0,.4);}
.admin{background:linear-gradient(180deg,#2a1a4d,#170c30);color:var(--gold);text-shadow:none;border:2px solid rgba(255,201,60,.55);box-shadow:0 9px 0 #0a0514,0 14px 0 rgba(0,0,0,.4),0 0 24px rgba(255,201,60,.25);}
.admin:active{box-shadow:0 2px 0 #0a0514,0 5px 0 rgba(0,0,0,.4);}
.foot{margin-top:34px;color:var(--muted);font-size:12px;font-weight:700;letter-spacing:2px;position:relative;z-index:1;}
#gateBox{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:var(--bg);padding:20px;text-align:center;}
#gateBox .gateTitle{font-family:'Bungee';color:var(--gold);font-size:clamp(20px,4vw,30px);margin-bottom:22px;text-shadow:0 0 18px rgba(255,201,60,.5);}
#gateBox input{width:min(90vw,300px);padding:14px 16px;margin-bottom:12px;border-radius:14px;border:2px solid var(--viola);
  background:var(--panel);color:#fff;font-size:16px;font-family:'Outfit',sans-serif;outline:none;}
#gateBox input:focus{border-color:var(--cyan);}
#gateBox button{width:min(90vw,300px);padding:14px;border-radius:14px;border:0;font-family:'Bungee';font-size:16px;
  background:linear-gradient(180deg,#ff5db1,var(--magenta));color:#fff;cursor:pointer;box-shadow:0 6px 0 #8a0050;margin-top:6px;}
#gateBox button:active{box-shadow:0 2px 0 #8a0050;transform:translateY(4px);}
#gateErr{color:#ff5d5d;font-weight:700;font-size:13px;margin-top:14px;min-height:16px;}
#hubContent{display:none;}
</style>
</head>
<body>
<div id="gateBox">
  <div class="gateTitle">🔒 IL CAPONE<br>QUARTIER GENERALE</div>
  <input type="text" id="gateUser" placeholder="Utente" autocomplete="username">
  <input type="password" id="gatePass" placeholder="Password" autocomplete="current-password">
  <button onclick="checkGate()">🎩 ENTRA</button>
  <div id="gateErr"></div>
</div>
<div id="hubContent"></div>

function showHub(){
  document.getElementById('gateBox').style.display = 'none';
  buildHubContent();
  const h = document.getElementById('hubContent');
  h.style.display = 'flex'; h.style.flexDirection = 'column'; h.style.alignItems = 'center'; h.style.width = '100%';
}
function checkGate(){
  const u = document.getElementById('gateUser').value.trim();
  const p = document.getElementById('gatePass').value;
  if (u === GATE_USER && p === GATE_PASS){
    try{ localStorage.setItem('capone_hub_auth', '1'); }catch(e){}
    showHub();
  } else {
    document.getElementById('gateErr').textContent = 'Utente o password errati.';
  }
}
document.getElementById('gatePass').addEventListener('keydown', e=>{ if (e.key==='Enter') checkGate(); });
document.getElementById('gateUser').addEventListener('keydown', e=>{ if (e.key==='Enter') checkGate(); });
try{ if (localStorage.getItem('capone_hub_auth') === '1') showHub(); }catch(e){}
</script>
